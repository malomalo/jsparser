name: CI

on:
  push:
  pull_request:

jobs:
  jsparser:
    name: JSParser Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.4
          - '4.0'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # For the acorn oracle, which checks test/oracle/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: test/oracle

      - run: bundle exec rake test
        env:
          REQUIRE_ORACLE: 1
